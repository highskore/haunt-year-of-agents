[package]
# Fixed so the manifest's `entry` path stays valid in every plugin made from this template.
name = "haunt-plugin"
description = "A calendar heatmap of your finished agent turns in Haunt"
edition = "2024"
license = "MIT"
version = "0.1.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
toml = "0.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[workspace]
